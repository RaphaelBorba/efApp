version: '3.8'

# Ambiente local de desenvolvimento
# Uso: docker compose up

services:
  mongo:
    image: mongo:6
    container_name: ef-mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - ef-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: ef-api-dev
    environment:
      - MONGO_URI=mongodb://mongo:27017/efenergia_dev
      - APP_JWT_SECRET=${APP_JWT_SECRET:-bXlzdXBlcnNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjI1NmJpdHM=}
      - APP_JWT_EXPIRATION_SECONDS=${APP_JWT_EXPIRATION_SECONDS:-3600}
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ef-dev
    restart: unless-stopped

networks:
  ef-dev:
    driver: bridge

volumes:
  mongo_dev_data:
