name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/devops-setup]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar projeto
        run: cd api && mvn clean package -DskipTests

      - name: Executar testes
        run: cd api && mvn test

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagem Docker
        run: docker build -t ef-energia-api:staging ./api

      - name: Deploy staging
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET_STAGING }}
        run: docker compose -f docker-compose.staging.yml up -d --build

      - name: Verificar saúde da API (staging)
        run: |
          sleep 20
          curl --fail http://localhost:8081/actuator/health

  deploy-production:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagem Docker
        run: docker build -t ef-energia-api:latest ./api

      - name: Deploy produção
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET_PROD }}
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Verificar saúde da API (produção)
        run: |
          sleep 20
          curl --fail http://localhost:8080/actuator/health
