spring:
  application:
    name: ef-energia-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/efenergia}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:bXlzdXBlcnNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjI1NmJpdHM=}
      expiration: ${APP_JWT_EXPIRATION_SECONDS:3600}

server:
  port: 8080
